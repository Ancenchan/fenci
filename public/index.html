<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenci - 歌词爬取控制台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
    background: #0f1023; color: #e6e6f0; line-height: 1.6;
  }
  .app {
    max-width: 1100px; margin: 0 auto; display: grid;
    grid-template-columns: 360px 1fr; gap: 24px;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }
  h1 {
    margin: 0 0 4px; font-size: 24px;
    background: linear-gradient(90deg,#FF6699,#33CCBB,#FF7722,#0077DD);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub { color: #8a8aa8; margin: 0 0 20px; font-size: 13px; }
  .panel {
    background: #1a1c38; border: 1px solid #2a2d55;
    border-radius: 12px; padding: 18px; margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px; margin: 0 0 12px;
    color: #9ea3d0; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase;
  }
  label { display: block; font-size: 13px; color: #b9bdd9; margin-bottom: 8px;}
  input[type="text"] {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border-radius: 8px; border: 1px solid #3a3e6f;
    background: #10122a; color: #f1f1f8; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus {
    border-color: #62d8d8;
    box-shadow: 0 0 0 3px rgba(98,216,216,.15);
  }
  button.btn {
    margin-top: 12px; width: 100%; padding: 11px 16px;
    font-size: 14px; font-weight: 600; color: #062727;
    border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg,#62d8d8,#33CCBB);
    transition: transform .1s ease, box-shadow .15s ease;
  }
  button.btn:hover:not(:disabled) { box-shadow: 0 6px 18px rgba(98,216,216,.25); }
  button.btn:active:not(:disabled) { transform: translateY(1px); }
  button.btn:disabled { opacity: .55; cursor: not-allowed; }

  .tips {
    font-size: 12px; color: #7d81a6; margin-top: 10px; line-height: 1.5;
  }
  .tips code {
    background: #10122a; color: #62d8d8;
    padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }

  /* 状态提示条 */
  .status {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    font-size: 13px; display: none;
  }
  .status.show { display: block; }
  .status.loading { background: rgba(98,216,216,.08); color: #62d8d8; border: 1px solid rgba(98,216,216,.3); }
  .status.success { background: rgba(80,200,120,.1); color: #95e0a8; border: 1px solid rgba(80,200,120,.3); }
  .status.error   { background: rgba(240,90,90,.1);  color: #f5a5a5; border: 1px solid rgba(240,90,90,.3);  }
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(98,216,216,.3);
    border-top-color: #62d8d8; border-radius: 50%;
    animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 搜索框 */
  .search-box {
    margin-bottom: 10px;
  }
  .search-box input {
    width: 100%; padding: 8px 10px; font-size: 13px;
    border-radius: 6px; border: 1px solid #3a3e6f;
    background: #10122a; color: #f1f1f8; outline: none;
  }
  .search-box input:focus { border-color: #62d8d8; }

  /* 分页 */
  .pagination {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #2a2d55;
  }
  .pg-btn {
    padding: 6px 12px; font-size: 12px; border-radius: 6px;
    background: #22254a; color: #cfd2ee; border: 1px solid #32365e;
    cursor: pointer;
  }
  .pg-btn:hover:not(:disabled) { background: #2d3163; color: #fff; }
  .pg-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pg-info { font-size: 12px; color: #7d81a6; }

  /* 文件列表 */
  .file-list { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  .file-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px;
    background: #10122a; border: 1px solid #2a2d55;
    transition: background .15s ease;
    cursor: pointer;
  }
  .file-list li:hover { background: #181b3a; }
  .file-list li.active { border-color: #62d8d8; background: #181b3a; }
  .file-list .name {
    font-size: 13px; color: #dfe2f7; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 240px;
  }
  .file-list .meta {
    font-size: 11px; color: #7d81a6; margin-top: 2px;
  }
  .mini-btn {
    padding: 5px 10px; font-size: 11px; border-radius: 6px;
    background: #22254a; color: #cfd2ee; border: 1px solid #32365e;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .mini-btn:hover { background: #2d3163; color: #fff; }
  .mini-btn.primary {
    background: linear-gradient(135deg,#FF6699,#00BBDD);
    border: none; color: #fff; font-weight: 600;
  }
  .mini-btn.danger {
    background: #3a1520; border: 1px solid #5a2535; color: #f5a5a5;
  }
  .mini-btn.danger:hover { background: #5a1a2a; color: #fff; }
  .mini-btn:disabled { opacity: .5; cursor: not-allowed; }
  .empty {
    text-align: center; padding: 20px; color: #6a6f99;
    font-size: 13px;
  }

  /* 预览区 */
  .preview-wrap {
    background: #1a1c38; border: 1px solid #2a2d55;
    border-radius: 12px; padding: 14px; min-height: 600px;
    display: flex; flex-direction: column;
  }
  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px solid #2a2d55;
  }
  .preview-header h2 {
    margin: 0; font-size: 15px; color: #dfe2f7;
  }
  .preview-header .actions { display: flex; gap: 8px; align-items: center; }
  .preview-wrap iframe {
    flex: 1; border: none; width: 100%;
    background: #1a1a2e; border-radius: 8px;
    min-height: 520px;
  }
  .preview-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #6a6f99; font-size: 14px;
    border: 2px dashed #2a2d55; border-radius: 8px;
  }

  /* 复制成功提示 */
  .copy-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #33CCBB; color: #062727; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
    z-index: 999;
  }
  .copy-toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <!-- 左栏 -->
  <aside>
    <h1>🎤 Fenci 歌词控制台</h1>
    <p class="sub">Project SEKAI Wiki → 彩色歌词 HTML</p>

    <!-- 爬取表单 -->
    <div class="panel">
      <h2>爬取新歌</h2>
      <label for="url">歌词页面 URL</label>
      <input id="url" type="text"
             placeholder="https://projectsekai.fandom.com/wiki/RAD_DOGS">
      <label for="songName" style="margin-top: 12px;">自定义歌曲名（可选，方便搜索）</label>
      <input id="songName" type="text"
             placeholder="留空则自动从页面提取">
      <button id="scrapeBtn" class="btn">开始爬取并生成 HTML</button>
      <a href="https://projectsekai.fandom.com/wiki/Category:Commissioned_Songs" target="_blank"
         style="display:block; text-align:center; margin-top:10px; padding:9px 14px; font-size:13px; font-weight:600;
                border-radius:8px; background:#22254a; border:1px solid #3a3e6f; color:#62d8d8; text-decoration:none;">
        🎵 浏览歌曲列表 →
      </a>
      <div class="status" id="status"></div>
      <div class="tips">
        示例：<code>https://projectsekai.fandom.com/wiki/RAD_DOGS</code><br>
        填了自定义歌曲名会用作文件名和列表显示，方便搜索
      </div>
    </div>

    <!-- 已生成文件列表 -->
    <div class="panel">
      <h2>已生成歌词 <span id="count" style="color:#62d8d8;float:right;">0</span></h2>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="🔍 搜索歌曲名…">
      </div>
      <ul id="fileList" class="file-list"></ul>
      <div id="pagination" class="pagination" style="display:none;">
        <button class="pg-btn" id="pgPrev" disabled>‹ 上一页</button>
        <span class="pg-info" id="pgInfo"></span>
        <button class="pg-btn" id="pgNext">下一页 ›</button>
      </div>
    </div>
  </aside>

  <!-- 右栏：预览 -->
  <section class="preview-wrap">
    <div class="preview-header">
      <h2 id="previewTitle">预览</h2>
      <div class="actions" id="previewActions" style="display:none;">
        <a id="openTabBtn" class="mini-btn" href="#" target="_blank">新标签页打开 ↗</a>
        <button id="copyHtmlBtn" class="mini-btn">复制 HTML</button>
        <button id="deleteBtn" class="mini-btn danger">删除</button>
      </div>
    </div>
    <div id="previewEmpty" class="preview-empty">
      从左侧输入 URL 爬取，或点击已生成歌词的「预览」
    </div>
    <iframe id="previewFrame" style="display:none;" title="lyrics preview"></iframe>
  </section>
</div>

<div class="copy-toast" id="copyToast">✅ HTML 已复制到剪贴板</div>

<script>
  const $ = (id) => document.getElementById(id);
  const apiBase = ''; // 同源即可

  const statusEl = $('status');
  const scrapeBtn = $('scrapeBtn');
  const urlInput = $('url');
  const songNameInput = $('songName');
  const searchInput = $('searchInput');
  const fileListEl = $('fileList');
  const countEl = $('count');
  const previewEmpty = $('previewEmpty');
  const previewFrame = $('previewFrame');
  const previewTitle = $('previewTitle');
  const openTabBtn = $('openTabBtn');
  const previewActions = $('previewActions');
  const copyHtmlBtn = $('copyHtmlBtn');
  const deleteBtn = $('deleteBtn');
  const copyToast = $('copyToast');

  let allFiles = [];        // 全部文件列表
  let currentFile = null;   // 当前预览的文件 { filename, song_name }
  const PAGE_SIZE = 5;
  let currentPage = 1;

  const pgPrevBtn = $('pgPrev');
  const pgNextBtn = $('pgNext');
  const pgInfoEl = $('pgInfo');
  const paginationEl = $('pagination');

  pgPrevBtn.addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderFileList(filterFiles()); }
  });
  pgNextBtn.addEventListener('click', () => {
    const totalPages = Math.ceil(filterFiles().length / PAGE_SIZE);
    if (currentPage < totalPages) { currentPage++; renderFileList(filterFiles()); }
  });

  function setStatus(kind, text) {
    statusEl.className = 'status show ' + kind;
    statusEl.innerHTML = text;
  }
  function hideStatus() {
    statusEl.className = 'status';
  }

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1024 / 1024).toFixed(2) + ' MB';
  }
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderFileList(files) {
    fileListEl.innerHTML = '';
    const totalItems = files.length;
    const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
    const start = (currentPage - 1) * PAGE_SIZE;
    const paged = files.slice(start, start + PAGE_SIZE);

    if (totalItems === 0) {
      fileListEl.innerHTML = '<li class="empty">没有匹配的歌词文件</li>';
      paginationEl.style.display = 'none';
      return;
    }

    paged.forEach(f => {
      const li = document.createElement('li');
      if (currentFile && currentFile.filename === f.filename) {
        li.classList.add('active');
      }
      li.innerHTML = `
        <div>
          <div class="name" title="${f.song_name}">${f.song_name}</div>
          <div class="meta">${fmtSize(f.size)}${f.mtime ? ' · ' + fmtTime(f.mtime) : ''}</div>
        </div>
        <div class="actions">
          <button class="mini-btn primary" data-f="${f.filename}" data-name="${f.song_name}">预览</button>
        </div>
      `;
      li.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        previewFile(f.filename, f.song_name);
      });
      fileListEl.appendChild(li);
    });
    fileListEl.querySelectorAll('button[data-f]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const fn = btn.getAttribute('data-f');
        const nm = btn.getAttribute('data-name');
        previewFile(fn, nm);
      });
    });

    if (totalItems > PAGE_SIZE) {
      paginationEl.style.display = 'flex';
      pgInfoEl.textContent = `第 ${currentPage} / ${totalPages} 页（共 ${totalItems} 首）`;
      pgPrevBtn.disabled = currentPage <= 1;
      pgNextBtn.disabled = currentPage >= totalPages;
    } else {
      paginationEl.style.display = 'none';
    }
  }

  function filterFiles() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return allFiles;
    return allFiles.filter(f => f.song_name.toLowerCase().includes(q));
  }

  async function refreshList() {
    try {
      const res = await fetch(`${apiBase}/api/list`, { cache: 'no-cache' });
      const data = await res.json();
      allFiles = data.files || [];
      countEl.textContent = allFiles.length;
      renderFileList(filterFiles());
    } catch (e) {
      countEl.textContent = '?';
      fileListEl.innerHTML = `<li class="empty" style="color:#f5a5a5; line-height:1.8;">
        ⚠️ 无法连接后端<br><br>
        <span style="color:#7d81a6;font-size:12px;">${e}<br><br>
        请确保已部署到 Cloudflare Pages 并配置了环境变量。</span>
      </li>`;
    }
  }

  // 带重试的列表刷新：等待 5 秒后检查新文件是否出现，最多重试 4 次
  async function refreshListWithRetry(expectedFilename) {
    const delays = [5000, 5000, 5000, 5000]; // 共 4 次，每次等 5 秒
    for (let i = 0; i < delays.length; i++) {
      await new Promise(r => setTimeout(r, delays[i]));
      try {
        const res = await fetch(`${apiBase}/api/list`, { cache: 'no-cache' });
        const data = await res.json();
        allFiles = data.files || [];
        const found = allFiles.some(f => f.filename === expectedFilename);
        renderFileList(filterFiles());
        countEl.textContent = allFiles.length;
        if (found) return; // 文件已出现，停止重试
      } catch (_) { /* 忽略，继续重试 */ }
    }
  }

  searchInput.addEventListener('input', () => {
    currentPage = 1;
    renderFileList(filterFiles());
  });

  function previewFile(filename, displayName) {
    const url = `${apiBase}/songs/${encodeURIComponent(filename)}`;
    previewEmpty.style.display = 'none';
    previewFrame.style.display = 'block';
    previewFrame.src = url;
    previewTitle.textContent = `预览 · ${displayName || filename}`;
    openTabBtn.href = url;
    previewActions.style.display = 'flex';
    currentFile = { filename, song_name: displayName || filename };
    // 更新列表高亮
    renderFileList(filterFiles());
  }

  // ── 删除当前预览的文件 ──
  deleteBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    const { filename, song_name } = currentFile;
    if (!confirm(`确定删除「${song_name}」吗？\n这会从 GitHub 仓库永久移除该文件。`)) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = '删除中…';
    try {
      const res = await fetch(`${apiBase}/api/delete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      // 清空预览
      currentFile = null;
      previewFrame.style.display = 'none';
      previewEmpty.style.display = 'flex';
      previewTitle.textContent = '预览';
      previewActions.style.display = 'none';
      await refreshList();
    } catch (e) {
      alert(`删除失败：${e.message}`);
    } finally {
      deleteBtn.disabled = false;
      deleteBtn.textContent = '删除';
    }
  });

  // ── 复制 HTML 代码 ──
  copyHtmlBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    copyHtmlBtn.textContent = '获取中…';
    copyHtmlBtn.disabled = true;
    try {
      const res = await fetch(`${apiBase}/songs/${encodeURIComponent(currentFile.filename)}`);
      const html = await res.text();
      await navigator.clipboard.writeText(html);
      copyToast.classList.add('show');
      setTimeout(() => copyToast.classList.remove('show'), 2000);
    } catch (e) {
      alert(`复制失败：${e.message}`);
    } finally {
      copyHtmlBtn.textContent = '复制 HTML';
      copyHtmlBtn.disabled = false;
    }
  });

  // ── 爬取 ──
  async function doScrape() {
    const url = urlInput.value.trim();
    const customName = songNameInput.value.trim();

    if (!url) {
      setStatus('error', '请输入 URL');
      return;
    }
    scrapeBtn.disabled = true;
    hideStatus();
    setStatus('loading', '<span class="spinner"></span>正在爬取页面，生成歌词 HTML…');

    try {
      const res = await fetch(`${apiBase}/api/scrape`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, song_name: customName || undefined }),
      });
      let data;
      try {
        data = await res.json();
      } catch (_) {
        const text = await res.text().catch(() => '');
        const shortText = text.length > 300 ? text.slice(0, 300) + '…' : text;
        throw new Error(`服务器返回非 JSON (HTTP ${res.status}): ${shortText || '无内容'}`);
      }
      if (!res.ok || !data.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      setStatus('success',
        `✅ 生成成功：<b>${data.song_name}</b> ` +
        `<span style="opacity:.7;">(${data.tabs.join(' / ')} · ${fmtSize(data.size_bytes)})</span>`);
      songNameInput.value = ''; // 清空歌曲名
      previewFile(data.filename, data.song_name);
      // 延迟刷新列表（GitHub API 有延迟，刚提交的文件不会立即出现）
      refreshListWithRetry(data.filename);
    } catch (e) {
      setStatus('error', `❌ 失败：${e.message}`);
    } finally {
      scrapeBtn.disabled = false;
    }
  }

  scrapeBtn.addEventListener('click', doScrape);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doScrape();
  });
  songNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doScrape();
  });

  // 初始加载文件列表
  refreshList();
</script>
</body>
</html>
